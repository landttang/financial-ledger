<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나만의 가계부</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        form { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; margin-top: 10px; font-size: 14px; color: #333; }
        input, select, button { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h2>💰 가계부 입력하기</h2>
    <form id="ledgerForm">
        <label>날짜</label>
        <input type="date" id="date" required>
        
        <label>유형</label>
        <select id="type">
            <option value="지출">지출</option>
            <option value="수입">수입</option>
            <option value="이체">이체</option>
        </select>
        
        <label>금액</label>
        <input type="number" id="amount" placeholder="예: 10000" required>
        
        <label>카테고리</label>
        <input type="text" id="category" placeholder="예: 식비" required>
        
        <label>서브카테고리</label>
        <input type="text" id="subCategory" placeholder="예: 카페">
        
        <label>설명</label>
        <input type="text" id="description" placeholder="예: 거래처 미팅 커피">
        
        <label>신용카드</label>
        <input type="text" id="creditCard" placeholder="예: 현대카드">
        
        <!-- 년월 칸은 서버가 자동으로 계산하므로 화면에서는 삭제했습니다! -->
        
        <button type="submit">저장하기</button>
    </form>

    <!-- 여기서부터 서버와 통신하는 마법의 코드입니다 -->
    <script>
        document.getElementById('ledgerForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // 새로고침 방지

            // 사용자가 입력한 7가지 데이터 수집
            const data = {
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                subCategory: document.getElementById('subCategory').value,
                description: document.getElementById('description').value,
                creditCard: document.getElementById('creditCard').value
            };

            try {
                // 서버로 슉! 보내기
                const response = await fetch('http://localhost:3000/api/ledger', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('구글 시트에 성공적으로 저장되었습니다! 🎉');
                    document.getElementById('ledgerForm').reset(); // 입력칸 깔끔하게 비우기
                } else {
                    alert('저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버와 연결할 수 없습니다. 터미널에서 서버가 켜져 있는지 확인해 주세요.');
            }
        });
    </script>
</body>
</html>
