<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나만의 가계부</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 15px; background-color: #f4f7f6; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: bold; font-size: 14px; color: #555; margin-top: 5px; }
        
        input, select, button { padding: 14px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; width: 100%; }
        input:focus, select:focus { outline: none; border-color: #4CAF50; box-shadow: 0 0 5px rgba(76, 175, 80, 0.3); }
        
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 20px; font-weight: bold; font-size: 18px; padding: 16px; }
        button:hover { background-color: #45a049; }

        .color-expense { color: #e53935; font-weight: bold; }
        .color-income { color: #1e88e5; font-weight: bold; }
        .color-transfer { color: #43a047; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>💰 가계부 입력하기</h2>
        <form id="ledgerForm">
            <label>날짜</label>
            <input type="date" id="date" required>
            
            <label>유형</label>
            <select id="type" onchange="updateTypeColor()">
                <option value="지출" class="color-expense">지출</option>
                <option value="수입" class="color-income">수입</option>
                <option value="이체" class="color-transfer">이체</option>
            </select>
            
            <label>금액</label>
            <input type="number" id="amount" placeholder="예: 10000" required>
            
            <!-- 변경점 1: 카테고리가 바뀔 때 updateSubCategory() 함수를 실행하도록 설정 -->
            <label>카테고리</label>
            <select id="category" required onchange="updateSubCategory()">
                <option value="">선택해주세요</option>
                <option value="식비">식비</option>
                <option value="교통/차량">교통/차량</option>
                <option value="사무실 운영">사무실 운영</option>
                <option value="광고/홍보">광고/홍보</option>
                <option value="기타">기타</option>
            </select>
            
            <!-- 변경점 2: 처음에는 비워두고 안내 문구만 띄웁니다 -->
            <label>서브카테고리</label>
            <select id="subCategory">
                <option value="">먼저 카테고리를 선택하세요</option>
            </select>
            
            <label>설명</label>
            <input type="text" id="description" placeholder="예: 거래처 미팅 커피">
            
            <label>신용카드 / 계좌</label>
            <input type="text" id="creditCard" placeholder="예: 현대카드 / 국민은행">
            
            <button type="submit">저장하기</button>
        </form>
    </div>

    <script>
        document.getElementById('date').value = new Date().toISOString().substring(0, 10);

        function updateTypeColor() {
            const typeSelect = document.getElementById('type');
            typeSelect.className = ''; 
            if(typeSelect.value === '지출') typeSelect.classList.add('color-expense');
            if(typeSelect.value === '수입') typeSelect.classList.add('color-income');
            if(typeSelect.value === '이체') typeSelect.classList.add('color-transfer');
        }
        updateTypeColor(); 

        // ★ 변경점 3: 대분류에 따른 소분류 데이터 세팅 ★
        const subCategoryData = {
            "식비": ["식사/회식", "커피/음료", "간식"],
            "교통/차량": ["주유비", "주차비", "대중교통", "차량유지/수리", "톨게이트비"],
            "사무실 운영": ["비전프라자 관리비", "사무실 임대료", "통신/인터넷", "사무용품/비품", "기타 운영비"],
            "광고/홍보": ["네이버 매물 등록비", "탐색플러스 구독료", "블로그/SNS 홍보비", "기타 광고비"],
            "기타": ["경조사비", "교육/도서", "세금", "기타"]
        };

        // 선택된 대분류에 맞춰 소분류 목록을 바꿔주는 함수
        function updateSubCategory() {
            const categorySelect = document.getElementById('category');
            const subCategorySelect = document.getElementById('subCategory');
            const selectedCategory = categorySelect.value;

            // 1. 기존에 있던 소분류 목록 싹 지우기
            subCategorySelect.innerHTML = '<option value="">선택해주세요</option>';

            // 2. 선택된 대분류에 맞는 소분류들을 하나씩 만들어 넣기
            if (subCategoryData[selectedCategory]) {
                subCategoryData[selectedCategory].forEach(item => {
                    const option = document.createElement('option');
                    option.value = item;
                    option.textContent = item;
                    subCategorySelect.appendChild(option);
                });
            }
        }

        // 서버 전송 로직
        document.getElementById('ledgerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                subCategory: document.getElementById('subCategory').value,
                description: document.getElementById('description').value,
                creditCard: document.getElementById('creditCard').value
            };

            try {
                // 주의: 아래 주소가 대표님의 Render 서버 주소가 맞는지 확인해주세요!
                const response = await fetch('https://financial-ledger-x6nh.onrender.com/api/ledger', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('구글 시트에 성공적으로 저장되었습니다! 🎉');
                    document.getElementById('amount').value = '';
                    document.getElementById('description').value = '';
                } else {
                    alert('저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버와 연결할 수 없습니다.');
            }
        });
    </script>
</body>
</html>
